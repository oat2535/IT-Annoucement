version: '3.8'

services:
  web:
    build: .
    ports:
      - "5889:5889" # Map port 5889 (เปลี่ยนจาก 5886 เพื่อไม่ให้ Port ชนกันหากรันบน VM เดียวกัน)
    
    # --- เพิ่มการตั้งค่า Volumes ตรงนี้ ---
    volumes:
      - /home/admintlp/it-annoucement-tlp:/app
    # --------------------------------

    # ใช้ environment variables ในการตั้งค่า
    environment:
      - DEBUG=${DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-9+jdk(%uodqv4yk!2do+a#41&k49=agn8bte4c8d=^is$&-83%}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - USE_HTTPS=${USE_HTTPS:-1}
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # ตั้งค่าให้ log output แสดงผลทันที (ไม่ buffer)
    tty: true
    stdin_open: true
    networks:
      - app_network

networks:
  app_network:
    driver: bridge